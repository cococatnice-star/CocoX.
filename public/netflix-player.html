<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        #ntf {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,20,0.9); color: #fff; padding: 10px 18px;
            border-radius: 12px; border: 1px solid #333; z-index: 99;
            display: none; align-items: center; gap: 12px; backdrop-filter: blur(5px);
        }
        #ntf b { color: #2ecc71; }
        #btn { background: #333; border: none; color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #444; background: #000; }
        body { background: #0b1520; color: #edf5fa; font-family: "Manrope", ui-sans-serif, system-ui, sans-serif; }
        #ifr { background: #0b1520; }
        .ld {
            color: #e9f1f7;
            background:
              radial-gradient(ellipse at 50% 35%, rgba(73, 128, 148, .2), transparent 48%),
              linear-gradient(145deg, #101e2b, #08121e);
            font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
        }
        .ld::before {
            content: ""; width: 26px; height: 26px; margin-right: 14px;
            border: 2px solid rgba(237,245,250,.18); border-top-color: #f2a56d;
            border-radius: 50%; animation: coco-spin .9s linear infinite;
        }
        @keyframes coco-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .ld::before { animation: none; } }
    </style>
</head>
<body>
    <div id="ld">Initialising...</div>
    <iframe id="ifr" allowfullscreen allow="autoplay; fullscreen; gamepad; microphone; camera"></iframe>
    <script>
        document.getElementById('ifr').src = "https://streamex.sh";
        document.getElementById('ifr').style.display = 'block';
        document.getElementById('ld').style.display = 'none';
    </script>
</body>
</html>
